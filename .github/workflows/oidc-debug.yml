name: OIDC Debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    name: Debug GitHub OIDC
    runs-on: ubuntu-latest

    steps:
      - name: Get OIDC token
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          echo "Requesting GitHub OIDC token..."

          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          echo "OIDC token received."

          python - "$TOKEN" <<'PY'
          import sys
          import json
          import base64

          token = sys.argv[1]
          parts = token.split(".")

          if len(parts) != 3:
              print("ERROR: OIDC token does not have 3 JWT parts")
              sys.exit(1)

          payload = parts[1]

          # Add Base64 padding
          payload += "=" * (-len(payload) % 4)

          decoded = base64.urlsafe_b64decode(payload)

          claims = json.loads(decoded)

          print("OIDC token claims:")
          print(json.dumps(claims, indent=2))
          PY
