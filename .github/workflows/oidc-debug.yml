name: OIDC Debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Get OIDC claims
        env:
          OIDC_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          OIDC_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          echo "Requesting GitHub OIDC token..."

          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")

          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)

          python3 - "$PAYLOAD" <<'PY'
          import sys
          import base64
          import json

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          data = json.loads(
              base64.urlsafe_b64decode(payload).decode()
          )

          print("")
          print("===== OIDC CLAIMS =====")
          print("iss =", data.get("iss"))
          print("aud =", data.get("aud"))
          print("sub =", data.get("sub"))
          print("repository =", data.get("repository"))
          print("repository_id =", data.get("repository_id"))
          print("repository_owner =", data.get("repository_owner"))
          print("repository_owner_id =", data.get("repository_owner_id"))
          print("=======================")
