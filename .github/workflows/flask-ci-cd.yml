name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: flask-practice

jobs:

  # =========================================================
  # 1. TEST
  # =========================================================
  test:
    name: 1. Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/test_student_db
      SECRET_KEY: ci-test-secret

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: |
          pytest -q


  # =========================================================
  # 2. BUILD AND PUSH DOCKER IMAGE
  # =========================================================
  build-and-push:
    name: 2. Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # AWS OIDC AUTHENTICATION
      # -------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::627917841032:role/GitHubActions-FlaskPractice
          aws-region: us-east-1

      # -------------------------------------------------------
      # LOGIN TO AMAZON ECR
      # -------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------------------------------------
      # BUILD DOCKER IMAGE
      # -------------------------------------------------------
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .

          docker tag \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # -------------------------------------------------------
      # PUSH DOCKER IMAGE TO ECR
      # -------------------------------------------------------
      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest
  # =========================================================
  # 3. DEPLOY TO EC2 USING AWS SYSTEMS MANAGER
  # =========================================================
  deploy:
    name: 3. Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::627917841032:role/GitHubActions-FlaskPractice
          aws-region: us-east-1

      - name: Deploy Docker container to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0404a669288581e49 \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Flask Practice application" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 627917841032.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 627917841032.dkr.ecr.us-east-1.amazonaws.com/flask-practice:latest",
              "docker rm -f flask-practice || true",
              "docker run -d --restart unless-stopped --name flask-practice --env-file /home/ec2-user/flask_Practice/.env -p 5000:5000 627917841032.dkr.ecr.us-east-1.amazonaws.com/flask-practice:latest"
            ]' \
            --region us-east-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          sleep 5

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0404a669288581e49 \
            --region us-east-1
